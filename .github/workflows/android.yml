name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Lets you start a build by hand from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # AGP 9.3 needs 17 or newer; 21 matches what the project is developed against.
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # The native payloads are committed prebuilt in app/src/main/jniLibs/arm64-v8a (extracted
    # from the published release APK), so no NDK is installed. Set OPENROOT_BUILD_NATIVE=1 and
    # add the nttld/setup-ndk step back if you want them compiled from source instead.

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. Beijing date, used for the artifact name and the release tag
    - name: Set version and date
      run: |
        DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d')
        echo "DATE=$DATE" >> $GITHUB_ENV
        echo "VERSION=v$DATE" >> $GITHUB_ENV

    # 2. Build a debug APK. It is signed with the standard debug key, so it installs on any
    #    device without creating a keystore or adding repository secrets.
    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    # 3. Rename so the artifact always carries the build date
    - name: Rename APK
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/app-debug.apk "dist/OpenRoot-shizuku-$VERSION.apk"
        ls -la dist/

    # 4. Always keep the APK, whether or not a release is created
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OpenRoot-shizuku-${{ env.VERSION }}
        path: dist/*.apk
        retention-days: 30

    # 5. On a push to the default branch, also publish it as a release asset.
    #    Uses GITHUB_TOKEN, no extra secrets required.
    - name: Publish Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}-shizuku
        name: ${{ env.VERSION }}-shizuku
        generate_release_notes: true
        files: dist/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
