# CVE-2020-0041 target profile: 5.4-qgki template.
#
# QGKI is Qualcomm's Generic Kernel Image: from Android 11 the vendor modules are built against a
# frozen KMI, so two devices on the same KMI share the core kernel layout even when their `uname -r`
# strings differ. The exploit itself is identical to the plain 5.4 profile; what changes is only
# which values appear here, so this file exists to make that difference explicit.
#
# Two things are worth knowing before filling this in:
#
#   * The binder node. Qualcomm ROMs commonly expose `/dev/binder` and `/dev/vndbinder`, and some
#     vendor daemons live on `/dev/hwbinder` instead. Whichever one the exploit can open is the one
#     to put here; a wrong node fails at `binder_open` without touching the kernel, so it is a safe
#     thing to get wrong.
#
#   * The symbol offsets. QGKI keeps the core kernel symbols in the same relative positions across
#     devices on one KMI, so a profile recovered from one KMI-matched device usually transfers. It
#     still must be verified: run `--dump-offsets` on the second device and compare.
#
# See 5.4-template.conf for how to obtain each value. This file is a skeleton, not a working profile.

release = 5.4.0-qgki-REPLACE-WITH-REAL-UNAME-R
binder_device = /dev/binder

# --- Kernel symbols, as offsets from the image base -------------------------------------------
selinux_enforcing_offset = 0
memstart_addr_offset = 0
sysctl_table_root_offset = 0
proc_douintvec_offset = 0
init_task_offset = 0
init_cred_offset = 0
pipe_fop_offset = 0

# --- struct task_struct member offsets --------------------------------------------------------
tasks_offset = 0
pid_offset = 0
mm_offset = 0
real_cred_offset = 0