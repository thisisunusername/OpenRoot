# CVE-2020-0041 target profile: 5.4 template.
#
# This file is a skeleton, not a working profile. Every value below is a property of ONE kernel
# build, and the placeholders are deliberately zero so that a missing number fails loudly instead of
# writing to the wrong kernel address.
#
# How to produce a real profile, in order of preference:
#
#   1. Run the exploit once on a device that already has root by another route (Magisk, an unlocked
#      bootloader, a factory engineering build), asking it to record the offsets:
#
#          ./binder54 <this file> --dump-offsets /data/local/tmp/5.4-real.conf
#
#   2. If you have the device's `vmlinux` or `System.map`, subtract the kernel image base from each
#      symbol address. `nm vmlinux | grep ' selinux_enforcing$'` and so on.
#
#   3. Ask the device for them while it is rooted:
#          cat /proc/kallsyms | grep -E ' (selinux_enforcing|memstart_addr|sysctl_table_root|
#                                          proc_douintvec|init_task|init_cred|pipefifo_fops)$'
#      then subtract the image base, which is the `_text` address.
#
# The four `*_offset` task_struct values cannot come from a symbol table: they are field positions
# inside an anonymous struct. Get them from `--dump-offsets`, or from an upstream port for the exact
# same kernel build. Guessing them panics the device.
#
# The `release` value must equal `uname -r` exactly; it is how the engine decides this profile
# applies to a device at all.

release = 5.4.0-REPLACE-WITH-REAL-UNAME-R
binder_device = /dev/binder

# --- Kernel symbols, as offsets from the image base -------------------------------------------
selinux_enforcing_offset = 0
memstart_addr_offset = 0
sysctl_table_root_offset = 0
proc_douintvec_offset = 0
init_task_offset = 0
init_cred_offset = 0
pipe_fop_offset = 0

# --- struct task_struct member offsets --------------------------------------------------------
tasks_offset = 0
pid_offset = 0
mm_offset = 0
real_cred_offset = 0